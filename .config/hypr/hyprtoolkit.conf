# hyprtoolkit palette (hyprpolkitagent and other hyprtoolkit apps).
# Matches the waybar theme in ~/.config/waybar/style.css (solarized light).
# Colors are 0xAARRGGBB.

background       = 0xFFFDF6E3 # waybar @base2, but opaque
base             = 0xFFE8E0D6 # waybar @highlight, lightened: inputs, buttons
alternate_base   = 0xFFEEE8D5 # solarized base2: details / user panels
text             = 0xFF657B83 # waybar @base00
bright_text      = 0xFF586E75 # waybar @base01
link_text        = 0xFF268BD2 # solarized blue (tmux status accent)
accent           = 0xFFDB8667 # waybar @accent (clock)
accent_secondary = 0xFFCB4B16 # waybar @orange

rounding_small = 5 # waybar border-radius: 5pt
rounding_large = 8

font_family           = JetBrainsMono Nerd Font Mono # Mono: icons (eye) fit one cell
font_family_monospace = JetBrainsMono Nerd Font Mono
h1_size         = 18
h2_size         = 16
h3_size         = 14
font_size       = 11
small_font_size = 10
