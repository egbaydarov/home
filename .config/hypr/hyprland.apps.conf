#################
### AUTOSTART ###
#################

$terminal = foot ~/.config/tmux/workspaces.sh
#$browser = chromium-browser --noerrordialogs --disable-gpu-compositing --enable-native-notifications --use-angle=vulkan
$browser = zen

#$fileManager = dolphin
#$menu = wofi --show drun
exec-once = hyprpaper
exec-once = waybar
exec-once = $terminal & $browser
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser

# sound defaults
exec-once = pactl set-default-source alsa_input.usb-Logitech_Yeti_GX_2424SGX01B68-00.mono-fallback
exec-once = pactl set-default-sink alsa_output.pci-0000_05_00.6.analog-stereo

# notifications daemon
exec-once = mako

exec-once = hyprctl hyprpaper reload , "$HOME/.config/hypr/windows.jpg"
exec-once = systemctl --user import-environment HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprpolkitagent

exec-once = hyprlock

# ------------------------------------------------------------
# GLOBAL FLOATING WINDOW DECORATION
# ------------------------------------------------------------

windowrule {
    name = floating-rounding
    match:class = .*
    match:float = true

    rounding = 8
}


# ------------------------------------------------------------
# ZEN BROWSER
# ------------------------------------------------------------

# Library / Downloads window
windowrule {
    name = zen-library
    match:class = ^(zen)$
    match:title = ^(Library)$

    float = on
    center = on
    size = 50% 66%
}

windowrule {
    name = zen-workspace
    match:class = ^(zen)$

    workspace = 1 silent
}


# ------------------------------------------------------------
# STEAM
# ------------------------------------------------------------

windowrule {
    name = steam
    match:class = ^(steam)$
#    match:initial_class = ^(steam)$

    float = on
    workspace = special:foo
    border_size = 0
    rounding = 8
}

# Keep floating Steam windows fully opaque
windowrule {
    name = steam-opacity
    match:class = ^(steam)$
    match:float = true

    opacity = 1.0 override 1.0 override 1.0 override
}

# Steam main window
windowrule {
    name = steam-main
    match:initial_title = ^(Steam)$

    float = on
    move = 815 226
    size = 1422 975
}

# Steam Friends List
windowrule {
    name = steam-friends
    match:initial_title = ^(Friends List)$

    float = on
    move = 280 308
    size = 300 650
}

workspace = special:foo, on-created-empty:[float] steam


# ------------------------------------------------------------
# KITTY
# ------------------------------------------------------------

windowrule {
    name = kitty
    match:class = ^(kitty)$

    float = on
    center = on
    size = 50% 66%
}

windowrule {
    name = kitty-floating-decoration
    match:class = ^(kitty)$
    match:float = true

    border_size = 0
    rounding = 8
}


# ------------------------------------------------------------
# YUBICO AUTHENTICATOR
# ------------------------------------------------------------

windowrule {
    name = yubioath
    match:class = ^(yubioath-flutter)$

    float = on
    center = on
    size = 50% 66%
    workspace = special:yubi silent
}

windowrule {
    name = yubioath-floating-decoration
    match:class = ^(yubioath-flutter)$
    match:float = true

    border_size = 0
    rounding = 8
}

workspace = special:yubi, on-created-empty:[float] yubioath-flutter


# ------------------------------------------------------------
# KEEPASSXC
# ------------------------------------------------------------

windowrule {
    name = keepassxc
    match:class = ^(org.keepassxc.KeePassXC)$

    float = on
    center = on
    size = 50% 66%
    workspace = special:keepassxc silent
}

windowrule {
    name = keepassxc-floating-decoration
    match:class = ^(org.keepassxc.KeePassXC)$
    match:float = true

    border_size = 0
    rounding = 8
}

workspace = special:keepassxc, on-created-empty:[float] keepassxc


# ------------------------------------------------------------
# DBEAVER
# ------------------------------------------------------------

windowrule {
    name = dbeaver
    match:class = ^(DBeaver)$

    float = on
    center = on
    size = 80% 86%
    workspace = special:dbeaver
}

windowrule {
    name = dbeaver-floating-decoration
    match:class = ^(DBeaver)$
    match:float = true

    border_size = 0
    rounding = 8
}

workspace = special:dbeaver, on-created-empty:[float] dbeaver


# ------------------------------------------------------------
# MONGODB COMPASS
# ------------------------------------------------------------

windowrule {
    name = mongodb-compass
    match:class = ^(MongoDB Compass)$

    float = on
    center = on
    size = 80% 86%
    workspace = special:mongo
}

windowrule {
    name = mongodb-floating-decoration
    match:class = ^(MongoDB Compass)$
    match:float = true

    border_size = 0
    rounding = 8
}

workspace = special:mongo, on-created-empty:[float] mongodb-compass --ignore-additional-command-line-flags --ozone-platform=x11 --password-store="gnome-libsecret" --no-autoUpdates


# ------------------------------------------------------------
# GIMP
# ------------------------------------------------------------

windowrule {
    name = gimp
    match:class = ^(gimp)$

    float = on
    center = on
    size = 80% 86%
    workspace = special:sketchpad
}

windowrule {
    name = gimp-floating-decoration
    match:class = ^(gimp)$
    match:float = true

    border_size = 0
    rounding = 8
}

workspace = special:sketchpad, on-created-empty:[float] gimp --no-splash


# ------------------------------------------------------------
# OBS STUDIO
# ------------------------------------------------------------

windowrule {
    name = obs-studio
    match:class = ^(com.obsproject.Studio)$

    float = on
    move = 22 54
    size = 80% 86%
    workspace = special:obs
}

windowrule {
    name = obs-floating-decoration
    match:class = ^(com.obsproject.Studio)$
    match:float = true

    border_size = 0
    rounding = 8
}

workspace = special:obs, on-created-empty:[float] obs


# ------------------------------------------------------------
# DROIDCAM
# ------------------------------------------------------------

windowrule {
    name = droidcam
    match:class = ^(droidcam)$

    float = on
    move = 2089 55
    workspace = special:obs
}

windowrule {
    name = droidcam-floating-decoration
    match:class = ^(droidcam)$
    match:float = true

    border_size = 0
    rounding = 8
}

# Preserve your custom OBS + DroidCam startup command.
# If special:obs should launch BOTH programs, use this
# instead of the simpler OBS workspace declaration above:
#
# workspace = special:obs, on-created-empty:[float] __NV_DISABLE_EXPLICIT_SYNC=1 obs --disable-shutdown-check --scene waycapture & droidcam


# ------------------------------------------------------------
# JAVA / DBEAVER STARTUP WINDOWS
# ------------------------------------------------------------

windowrule {
    name = java
    match:class = ^(java)$

    float = on
    center = on
}

windowrule {
    name = java-floating-decoration
    match:class = ^(java)$
    match:float = true

    border_size = 0
    rounding = 8
}


# ============================================================
# REGULAR WORKSPACE ASSIGNMENTS
# ============================================================

windowrule {
    name = lens-workspace
    match:class = ^(Lens)$

    workspace = 2 silent
}

windowrule {
    name = rider-workspace
    match:class = ^(jetbrains-rider)$

    workspace = 3 silent
}

windowrule {
    name = terminal-workspace
    match:class = ^(terminal)$

    workspace = 4 silent
}

windowrule {
    name = cursor-workspace
    match:class = ^(cursor)$

    workspace = 6 silent
}

windowrule {
    name = raddbg-workspace
    match:class = ^(raddbg.*)$

    workspace = 7 silent
}

windowrule {
    name = handmade-workspace
    match:class = ^(win32_handmade.exe)$

    workspace = 7 silent
}

windowrule {
    name = conhost-workspace
    match:class = ^(conhost.exe)$

    workspace = 8 silent
}

# Your original config also assigned MongoDB Compass to
# workspace 5, but special:mongo conflicts with that.
# The special:mongo assignment above takes priority here.
#
# To use regular workspace 5 instead:
# 1. Remove workspace = special:mongo from mongodb-compass.
# 2. Uncomment the following rule.
#
# windowrule {
#     name = mongodb-regular-workspace
#     match:class = ^(MongoDB Compass)$
#     workspace = 5 silent
# }


# ============================================================
# GLOBAL WINDOW BEHAVIOR
# ============================================================

# Ignore maximize requests from applications
windowrule {
    name = suppress-maximize
    match:class = .*

    suppress_event = maximize
}

# Fix invisible / ghost XWayland windows
windowrule {
    name = fix-xwayland-dragging
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = on
}


# ============================================================
# XWAYLAND
# ============================================================

xwayland {
    force_zero_scaling = true
}

